<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block_inline</title>
</head>
<body>
    <!-- Block level element prints in different lines -->
     <div>This is a div (block)</div>
     <p>This is a paragraph (block)</p>
     <h1>This is used for main heading (block)</h1>
    <section style ="border: 1px solid Apple">A section is also a block level element</section>

    <!-- inline elements prints in same line -->
     <!-- Using (br) tag for next line, -->
 <span>This is a span (inline) </span>
<br>
    <strong>This is strong,same as bold but it is semanting. </strong>
<br>
    <a href="#" > This creates a link (inline) </a>
<br>
    <em>This is for highlighting text (inline) </em>



</body>
</html>
